services:
  ssi-issuer:
    build:
      context: .
      dockerfile: ssi-issuer/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://host.docker.internal:27017/ssi-issuer
      SPRING_DATA_MONGODB_DATABASE: ssi-issuer
      APP_ISSUER_ENDPOINT: ${APP_ISSUER_ENDPOINT:-http://localhost:9090}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-izylife}
      APP_KEYCLOAK_OIDC_ENABLED: ${APP_KEYCLOAK_OIDC_ENABLED:-true}
      KEYCLOAK_ISSUER_CLIENT_ID: ${KEYCLOAK_ISSUER_CLIENT_ID:-ssi-issuer}
      KEYCLOAK_ISSUER_CLIENT_SECRET: ${KEYCLOAK_ISSUER_CLIENT_SECRET:-}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:8080"

  ssi-verifier:
    build:
      context: .
      dockerfile: ssi-verifier/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://host.docker.internal:27017/ssi-verifier
      SPRING_DATA_MONGODB_DATABASE: ssi-verifier
      APP_VERIFIER_ENDPOINT: ${APP_VERIFIER_ENDPOINT:-http://localhost:9091}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-master}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9091:8080"

  ssi-client:
    build:
      context: .
      dockerfile: ssi-client-application/Dockerfile
    restart: unless-stopped
    environment:
      APP_ISSUER_ENDPOINT: ${APP_ISSUER_ENDPOINT:-http://localhost:9090}
    depends_on:
      - ssi-issuer
    ports:
      - "9092:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./ssi-keycloak-provider/target/ssi-keycloak-provider-0.0.1-SNAPSHOT.jar:/opt/keycloak/providers/ssi-keycloak-provider.jar
      - ./ssi-issuer/keycloak/izylife-realm.json:/opt/keycloak/data/import/izylife-realm.json
    ports:
      - "8180:8080"

  ngrok-issuer:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http --domain=${NGROK_ISSUER_DOMAIN:-izylife-issuer.eu.ngrok.io} ssi-issuer:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - ssi-issuer
    ports:
      - "4040:4040"

  ngrok-verifier:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http --domain=${NGROK_VERIFIER_DOMAIN:-izylife-verifier.eu.ngrok.io} ssi-verifier:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - ssi-verifier
    ports:
      - "4041:4040"
